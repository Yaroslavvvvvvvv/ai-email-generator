name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # No credentials on purpose: the build has to succeed for anyone who
      # clones the repository, which is also what keeps the mock provider
      # honest as the default.
      - run: npm run build
